<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Please sign in</title>
    <link href="/css/main.css" rel="stylesheet" />
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <ul class="navbar-list">
            <li class="navbar-item"><a href="/" class="navbar-link">Home</a></li>
            <li class="navbar-item"><a href="/about" class="navbar-link">About</a></li>
            <li class="navbar-item dropdown">
                <a href="/products" class="navbar-link">Products</a>
            </li>
            <li class="navbar-item dropdown">
                <a href="#" class="navbar-link">Profile</a>
                <ul class="dropdown-menu">
                    <li><a href="/user" class="dropdown-link">Details</a></li>
                    <li><a href="/user/orders" class="dropdown-link">Orders</a></li>
                    <li><a href="/user/addresses" class="dropdown-link">Addresses</a></li>
                </ul>
            </li>
            <li class="navbar-item dropdown">
                <a href="#" class="navbar-link">Management</a>
                <ul class="dropdown-menu">
                    <li><a href="/admin" class="dropdown-link">Dashboard</a></li>
                    <li><a href="/admin/manage-products" class="dropdown-link">Products</a></li>
                    <li><a href="/admin/orders" class="dropdown-link">Orders</a></li>
                    <li><a href="/admin/packages" class="dropdown-link">Packages</a></li>
                </ul>
            </li>
            <li class="navbar-item navbar-logout">
                <form action="/logout" method="post" style="display:inline;">
                    <button type="submit" class="navbar-link logout-btn">Logout</button>
                </form>
            </li>
        </ul>
    </nav>
    <script>import('/js/navbar.js').then(m => m.Navbar.init());</script>
    <!-- Navbar End -->
    <div class="content">
        <form class="login-form" method="post" action="/login">
            <h2>Please sign in</h2>
            <div id="login-alert" class="alert alert-danger" role="alert" style="display: none;">Invalid credentials</div>
            <div id="logout-alert" class="alert alert-success" role="alert" style="display: none;">Successfully logged out</div>
            <p>
                <label for="username" class="screenreader">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required autofocus>
            </p>
            <p>
                <label for="password" class="screenreader">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </p>
            <div style="text-align: right; width: 100%; margin-bottom: 10px;">
                <a href="/public/recover-password" style="font-size: 0.95rem; color: var(--color-primary); text-decoration: underline;">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary wide">Sign in</button>
            <button type="button" class="btn btn-secondary wide" onclick="window.location.href='/registration'">Registration</button>
        </form>
    </div>
    <script src="/js/login.js"></script>
</body>

</html>
